<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Offline — INRIS Assistant</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: #f8fafc;
    color: #0f172a;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  }
  .card {
    max-width: 380px;
    width: 100%;
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    padding: 28px 24px;
    text-align: center;
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
  }
  h1 {
    font-size: 1.125rem;
    font-weight: 600;
    margin: 0 0 8px;
    letter-spacing: -0.01em;
  }
  p {
    font-size: 0.875rem;
    color: #64748b;
    line-height: 1.55;
    margin: 0 0 20px;
  }
  button {
    height: 44px;
    padding: 0 20px;
    border: none;
    border-radius: 8px;
    background: #2a4e7a;
    color: #ffffff;
    font-size: 0.875rem;
    font-weight: 500;
    cursor: pointer;
  }
  button:active { background: #234266; }
</style>
</head>
<body>
  <div class="card">
    <h1>You're offline</h1>
    <p>This page needs a connection. Guidance and case data are not stored on this device for privacy reasons, so nothing can be shown until you're back online.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
